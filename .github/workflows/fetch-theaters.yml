name: Fetch Theater Data

on:
  schedule:
    # 12:00 AM PHT (00:00 UTC+8) -> 16:00 UTC previous day
    - cron: '0 16 * * *'
    # 6:00 AM PHT (06:00 UTC+8) -> 22:00 UTC previous day
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      run_type:
        description: 'Run Type (initial / refresh)'
        required: false
        default: 'refresh'
        type: choice
        options:
          - initial
          - refresh
      dry_run:
        description: 'Dry Run (test fetch without writing to D1)'
        required: false
        default: false
        type: boolean

concurrency:
  group: fetch-theaters
  cancel-in-progress: false

jobs:
  fetch-and-sync:
    runs-on: ubuntu-latest
    name: Fetch & Sync to Cloudflare D1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Fetch Script
        run: node scripts/fetch-theaters.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME || 'thecinema-db' }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          RUN_TYPE: ${{ inputs.run_type }}
          DRY_RUN: ${{ inputs.dry_run }}
